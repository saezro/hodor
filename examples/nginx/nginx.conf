server {
    listen 80;
    server_name jellyfin.example.com;

    # hodor's own closed page / /tv pairing on the real hostname.
    location /.hodor/ {
        proxy_pass http://hodor:8080;
    }
    location /tv {
        proxy_pass http://hodor:8080;
    }

    location = /hodor-auth {
        internal;
        proxy_pass http://hodor:8080/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @hodor_closed {
        proxy_pass http://hodor:8080/.hodor/closed;
    }

    location / {
        auth_request /hodor-auth;
        error_page 401 = @hodor_closed;

        proxy_pass http://jellyfin:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
