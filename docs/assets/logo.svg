<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="hodor logo">
  <title>hodor</title>
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E29A4E"/>
      <stop offset="1" stop-color="#B9712B"/>
    </linearGradient>
  </defs>

  <!-- frame: rounded square card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FAF8F4"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#1C1B19" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- doorway opening (the frame hodor stands behind) -->
  <path d="M20 50 V26 a12 12 0 0 1 24 0 V50 Z" fill="#1C1B19"/>

  <!-- door leaf swung open on its hinge (right edge), revealing the dark opening -->
  <path d="M44 50 V26 a12 12 0 0 0 -11.3 -12 L30 14.6 a16 16 0 0 1 14 15.2 V50 Z" fill="url(#leaf)"/>

  <!-- plank lines on the leaf for texture, bold enough to survive 32px -->
  <line x1="37.5" y1="20" x2="37.5" y2="47" stroke="#8C5323" stroke-width="1.6" stroke-linecap="round"/>

  <!-- latch / handle: warm glow catching light through the gap -->
  <circle cx="35.5" cy="36" r="2.1" fill="#F2B766"/>

  <!-- threshold -->
  <rect x="18" y="50" width="28" height="3.2" rx="1.6" fill="#1C1B19"/>
</svg>
