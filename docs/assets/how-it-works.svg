<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>how hodor works</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6557"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A2E"/>
    </marker>
  </defs>

  <!-- card helper style via repeated rects -->

  <!-- row 1: internet path -->
  <g>
    <rect x="20" y="40" width="150" height="72" rx="10" fill="#F3F1EC" stroke="#DBD6CA" stroke-width="1.5"/>
    <text x="95" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#1C1B19">Internet</text>
    <text x="95" y="90" text-anchor="middle" font-size="11.5" fill="#6B6557">random visitor</text>
  </g>

  <line x1="170" y1="76" x2="222" y2="76" stroke="#6B6557" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="228" y="40" width="190" height="72" rx="10" fill="#F3F1EC" stroke="#DBD6CA" stroke-width="1.5"/>
    <text x="323" y="65" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1C1B19">Cloudflare Tunnel</text>
    <text x="323" y="83" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1C1B19">/ Traefik</text>
    <text x="323" y="100" text-anchor="middle" font-size="11" fill="#6B6557">TLS terminates here</text>
  </g>

  <line x1="418" y1="76" x2="470" y2="76" stroke="#6B6557" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="476" y="20" width="200" height="112" rx="12" fill="#1C1B19"/>
    <text x="576" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F2EDE4">hodor</text>
    <text x="576" y="72" text-anchor="middle" font-size="11.5" fill="#CFC8B8">closed by default</text>
    <rect x="496" y="84" width="160" height="30" rx="7" fill="#C97A2E"/>
    <text x="576" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#1C1B19">proxy / forwardAuth</text>
  </g>

  <line x1="676" y1="76" x2="728" y2="76" stroke="#6B6557" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="734" y="40" width="226" height="72" rx="10" fill="#F3F1EC" stroke="#DBD6CA" stroke-width="1.5"/>
    <text x="847" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1C1B19">Your service</text>
    <text x="847" y="90" text-anchor="middle" font-size="11.5" fill="#6B6557">GeoGuessr, Cluedo, &#8230;</text>
  </g>

  <!-- vertical gate indicator -->
  <line x1="576" y1="132" x2="576" y2="172" stroke="#C97A2E" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="576" y="188" text-anchor="middle" font-size="11.5" fill="#6B6557">open for N hours, then auto-closes</text>

  <!-- row 2: who can open it -->
  <g>
    <rect x="228" y="230" width="190" height="80" rx="10" fill="#F3F1EC" stroke="#DBD6CA" stroke-width="1.5"/>
    <text x="323" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#1C1B19">LAN / VPN</text>
    <text x="323" y="277" text-anchor="middle" font-size="11.5" fill="#6B6557">someone at home</text>
    <text x="323" y="294" text-anchor="middle" font-size="11.5" fill="#6B6557">opens the admin panel</text>
  </g>

  <path d="M418 265 C 450 265, 450 180, 476 120" fill="none" stroke="#C97A2E" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="400" y="230" font-size="11" fill="#C97A2E" text-anchor="middle">opens / closes</text>

  <g>
    <rect x="734" y="222" width="226" height="96" rx="10" fill="#F3F1EC" stroke="#DBD6CA" stroke-width="1.5"/>
    <text x="847" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#1C1B19">Screen / TV</text>
    <text x="847" y="267" text-anchor="middle" font-size="11.5" fill="#6B6557">goes to /tv</text>
    <rect x="800" y="276" width="94" height="26" rx="13" fill="#1C1B19"/>
    <text x="847" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#F2B766" letter-spacing="2">482 913</text>
  </g>

  <path d="M734 270 C 700 250, 680 150, 656 120" fill="none" stroke="#C97A2E" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="700" y="340" font-size="11" fill="#6B6557" text-anchor="middle" width="200">admin approves the PIN once &#8212; device keeps a long-lived pass</text>

  <line x1="323" y1="310" x2="323" y2="340" stroke="transparent"/>

  <!-- legend -->
  <g font-size="11" fill="#6B6557">
    <circle cx="30" cy="390" r="4" fill="#C97A2E"/>
    <text x="42" y="394">control flow (admin / device)</text>
    <circle cx="230" cy="390" r="4" fill="#6B6557"/>
    <text x="242" y="394">traffic flow (HTTP)</text>
  </g>
</svg>
